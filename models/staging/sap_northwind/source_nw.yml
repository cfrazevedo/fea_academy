version: 2

sources:
  - name: sap_northwind
    database: fea_academy
    schema: northwind
    tables:
      - name: orders
        description: Tabela de orders do erp da northwind
        columns:
          - name: order_id
            description: chave primária da tabela orders
            tests:
              - unique
              - not_null
          - name: customer_id
            description: chave estrangeira para conectar com a tabela customers
      - name: order_details